name: Physics Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'tools/**'
      - 'xmake.lua'
      - '.github/workflows/physics_tests.yml'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: '4.7.4'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install xmake
      run: |
        curl -fsSL https://xmake.io/get.sh | bash
        xrepo update-repo

    - name: Download Godot (headless)
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        sudo install Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
        godot --version

    - name: Build extension and tests via xmake
      run: |
        xmake config -y
        xmake build avbd avbd_core_test

    - name: Run every tier via xmake
      run: |
        xmake run run_all_tests
