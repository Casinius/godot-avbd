name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: godot-avbd-deterministic-linux.zip
          - os: windows-latest
            artifact_name: godot-avbd-deterministic-windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # === 计算 Release 使用的 tag ===
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # 自动生成临时 tag，与 v* 规则不冲突
            TAG="dev-${GITHUB_RUN_NUMBER}"
            # 如果希望更细粒度，也可以加入日期：
            # TAG="dev-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using release tag: ${TAG}"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: '${{ runner.os }}-xmake'
          package-cache: true
          package-cache-key: '${{ runner.os }}-xmake-packages'
          project-path: '.'
          build-cache: true
          build-cache-key: '${{ runner.os }}-xmake-build'

      - name: Install zip (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip scons

      - name: Configure xmake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xmake f -y
          xmake f --asan=n --tsan=n --ubsan=n

      - name: Configure xmake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: xmake f -p windows --toolchain=msvc -y

      - name: Build project
        run: xmake build -vD

      - name: Package
        shell: bash
        run: |
          mkdir -p tmp/gdavbd/bin
          cp ./demo/gdavbd/avbd.gdextension tmp/gdavbd/

          if [ "${RUNNER_OS}" == "Linux" ]; then
            cp ./demo/gdavbd/bin/libavbd.linux.* tmp/gdavbd/bin/
          elif [ "${RUNNER_OS}" == "Windows" ]; then
            cp ./demo/gdavbd/bin/*.dll tmp/gdavbd/bin/ 2>/dev/null || \
            cp ./demo/gdavbd/bin/*.lib tmp/gdavbd/bin/ 2>/dev/null || true
          else
            echo "Unsupported OS: ${RUNNER_OS}" >&2
            exit 1
          fi

          cd tmp
          if [ "${RUNNER_OS}" == "Windows" ]; then
            powershell -Command "Compress-Archive -Path gdavbd -DestinationPath ../${{ matrix.artifact_name }} -Force"
          else
            zip -r ../${{ matrix.artifact_name }} gdavbd
          fi

      # === 上传到 Release，使用上面计算出的 tag ===
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          # 非 v* tag 时标记为 prerelease（可选）
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
          files: ./${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}