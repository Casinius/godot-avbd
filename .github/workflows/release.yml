name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: godot-avbd-deterministic-linux.zip
          - os: windows-latest
            artifact_name: godot-avbd-deterministic-windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # === 计算 Release 使用的 tag ===
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # 自动生成临时 tag，与 v* 规则不冲突
            TAG="dev-${GITHUB_RUN_NUMBER}"
            # 如果希望更细粒度，也可以加入日期：
            # TAG="dev-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using release tag: ${TAG}"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: '${{ runner.os }}-xmake'
          package-cache: true
          package-cache-key: '${{ runner.os }}-xmake-packages'
          project-path: '.'
          build-cache: true
          build-cache-key: '${{ runner.os }}-xmake-build'

      - name: Install zip (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip scons

      - name: Configure xmake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xmake f -y
          xmake f --asan=n --tsan=n --ubsan=n

      - name: Setup Python for Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 使用一个稳定版本，避免使用 3.14 等最新版

      - name: Configure xmake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # 添加 --python 参数，显式指向 setup-python 设置的 Python 解释器
        run: |
          python -m pip install scons==4.9.1
          xmake f -p windows --toolchain=msvc -y
          cat 'C:\Users\runneradmin\AppData\Local\.xmake\cache\packages\2609\g\godotcpp4\4.1\installdir.failed\logs\install.txt'
      - name: Build project
        run: xmake build -vD

      - name: Package
        shell: bash
        run: |
          mkdir -p tmp/gdavbd/bin
          cp ./demo/gdavbd/avbd.gdextension tmp/gdavbd/

          if [ "${RUNNER_OS}" == "Linux" ]; then
            cp ./demo/gdavbd/bin/libavbd.linux.* tmp/gdavbd/bin/
          elif [ "${RUNNER_OS}" == "Windows" ]; then
            cp ./demo/gdavbd/bin/*.dll tmp/gdavbd/bin/ 2>/dev/null || \
            cp ./demo/gdavbd/bin/*.lib tmp/gdavbd/bin/ 2>/dev/null || true
          else
            echo "Unsupported OS: ${RUNNER_OS}" >&2
            exit 1
          fi

          cd tmp
          if [ "${RUNNER_OS}" == "Windows" ]; then
            powershell -Command "Compress-Archive -Path gdavbd -DestinationPath ../${{ matrix.artifact_name }} -Force"
          else
            zip -r ../${{ matrix.artifact_name }} gdavbd
          fi

   