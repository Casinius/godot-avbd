name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: |
        sudo apt update
        sudo apt install scons
        curl -fsSL https://xmake.io/shget.text | bash
        source ~/.xmake/profile
        xmake f -y
        xmake f --asan=n --tsan=n --ubsan=n
    - name: make
      run: xmake build -y
    - name: run core solver tests
      run: xmake run avbd_core_test
    - name: make distcheck
      run: echo "xmake not support"
