name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# The build is one xmake project script for every platform (see xmake.lua): the only thing that differs
# between the jobs below is the configure command, which is what each matrix row pins. Three
# configurations:
#   - Linux release            - the shipped shape, and the one whose scene failures are known;
#   - Linux debug + sanitizers - the memory/UB audit, which no other job runs;
#   - Windows release (MSVC)   - the platform the script's MSVC branch exists for. godot-cpp is built by
#                                scons there too, installed through pip.
#
# Every job gates on the solver suite. The gate is "no failure outside the known set" rather than a
# failure count: the digests, the thread-count comparisons, the closed-form equivalence tests and the
# projection/sleep behaviour checks must pass, while six scene checks (the stack penetration bounds and
# the primitives that rest on the ground) are known to fail. Swapping a known failure for a new one is a
# regression even though the count is unchanged. That set was measured with GCC, so on Windows the scene
# half of the gate reports instead of blocking - the determinism half is not negotiable anywhere.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux release
            os: ubuntu-latest
            platform: linux
            arch: x86_64
            mode: release
            flags: ""
            library: libavbd.linux.x86_64.so
            # The manifold pool holds recycled blocks by design, so leak detection would report the
            # cache rather than a leak.
            asan_options: ""
          - name: linux debug asan+ubsan
            os: ubuntu-latest
            platform: linux
            arch: x86_64
            mode: debug
            flags: "--asan=y --ubsan=y"
            library: libavbd.linux.x86_64.so
            asan_options: "detect_leaks=0"
          - name: windows release msvc
            os: windows-latest
            platform: windows
            arch: x64
            mode: release
            flags: "--toolchain=msvc"
            library: libavbd.windows.x86_64.dll
            asan_options: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: '${{ runner.os }}-xmake'
          package-cache: true
          package-cache-key: '${{ runner.os }}-xmake-packages'
          project-path: '.'
          build-cache: true
          build-cache-key: '${{ runner.os }}-${{ matrix.mode }}-xmake-build'

      # godot-cpp (the `godotcpp4` package) is built by scons, so the tool has to exist before xmake
      # resolves the package: apt on Linux, pip on Windows.
      - name: Install scons (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y scons

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scons (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install scons==4.9.1

      - name: Configure
        run: xmake f -p ${{ matrix.platform }} -a ${{ matrix.arch }} -m ${{ matrix.mode }} ${{ matrix.flags }} -y

      - name: Build
        run: xmake build -y

      # The manifest and the build have to agree on the library's name, or Godot silently reports a
      # missing extension. Both derive it from platform/arch (xmake.lua's godot_library_name), so this is
      # a cheap consistency check of that pair.
      - name: Extension artifact matches its manifest
        shell: bash
        run: |
          lib="${{ matrix.library }}"
          test -f "demo/gdavbd/bin/$lib" || { echo "::error::demo/gdavbd/bin/$lib was not produced"; exit 1; }
          grep -q "res://gdavbd/bin/$lib" demo/gdavbd/avbd.gdextension \
            || { echo "::error::avbd.gdextension does not list $lib"; exit 1; }
          echo "ok: $lib is built and listed"

      - name: Solver suite - determinism contract
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: "print_stacktrace=1"
        run: |
          # `xmake run` reports the target's nonzero exit as an error line after the suite's own output;
          # the suite is expected to exit nonzero while the known scene checks fail.
          xmake run avbd_core_test > suite.log 2>&1 || true
          grep -E 'checks, [0-9]+ failures' suite.log | tail -n 1 || true
          if grep -E '^FAIL  (in-process determinism|mixed digest|soft-body digest|projection digest|concurrent solver|closed-form|projection off is bit-neutral|contact scope off is the whole layer off|joint scope off is the whole layer off for joints)' suite.log; then
            echo "::error::a digest, determinism or equivalence check failed"
            exit 1
          fi
          echo "ok: digests and determinism checks pass"

      - name: Solver suite - known scene failures
        shell: bash
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: |
          grep -E '^  FAIL' suite.log || true
          known='cylinder rests on its cap|cylinder rests on its side|sphere rests at its radius|sphere stacks on sphere|stack interfaces|stack on ground'
          unknown=$(grep '^FAIL' suite.log | grep -Ev "^FAIL  ($known) " || true)
          if [ -n "$unknown" ]; then
            echo "::error::failing checks outside the known set:"
            echo "$unknown"
            exit 1
          fi
          echo "ok: only the six known scene checks fail"

      - name: Upload the suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.name }}
          path: suite.log
          if-no-files-found: ignore
